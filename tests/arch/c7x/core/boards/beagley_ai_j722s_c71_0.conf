# The DSP has no UART of its own. The console is the remoteproc trace buffer,
# which the generic OpenAMP resource table publishes.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n
CONFIG_IPM=y
CONFIG_IPM_MBOX=y
CONFIG_MBOX=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096

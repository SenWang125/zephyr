CONFIG_IPM=y
CONFIG_IPM_MBOX=y
CONFIG_MBOX=y
CONFIG_MBOX_TI_OMAP_C7X=y

CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n

CONFIG_POWEROFF=y

# The DSP has no UART of its own: the console is the remoteproc trace buffer.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# C7x saves a large register file on a call
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

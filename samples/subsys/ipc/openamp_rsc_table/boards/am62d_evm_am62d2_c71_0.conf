CONFIG_IPM=y
CONFIG_IPM_MBOX=y
CONFIG_MBOX=y
CONFIG_MBOX_TI_OMAP_C7X=y

# The DSP has no UART of its own: the console is the remoteproc trace buffer.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192

CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_RPMSG=n

# The TI Linux remoteproc and rpmsg drivers take 256-buffer vrings;
# the sample's own prj.conf asks for 8.
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=256
# C7x saves a large register file on a call, so the sample's 1024-byte
# stacks overflow during rpmsg setup
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_APP_TASK_STACK_SIZE=8192
CONFIG_APP_TTY_TASK_STACK_SIZE=1536
